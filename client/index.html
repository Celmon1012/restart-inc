    <!-- Chat widget (crm.restart.ng). Replaces the old Chatwoot embed on support.restart.ng.
         The chat is loaded only when a visitor clicks the button. Loading it with the page makes the CRM create an
         anonymous contact for every visit, even when nobody chats. The button below uses the same id as the widget's
         own bubble and looks the same, so the widget takes it over once loaded. -->
    <script>
      (function(d){
        var SDK_BASE = 'https://crm.restart.ng';
        var WIDGET_BASE = 'https://crm.restart.ng';
        window.evoChatSettings = {"position":"right","type":"expanded_bubble","launcherTitle":"Chat our team","apiBase":"https://api-crm.restart.ng"};
        var bubble = d.createElement('button');
        bubble.id = 'evo-widget-bubble';
        bubble.className = 'evo-widget-bubble';
        bubble.setAttribute('aria-label', 'Chat our team');
        bubble.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:2147483001;height:48px;width:auto;padding:0 14px;border-radius:999px;gap:8px;background:#00d4aa;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer;border:none;outline:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;font-weight:500;font-size:14px;line-height:1';
        bubble.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h6"/><path d="M17 3h4v4"/><path d="M21 3l-7 7"/></svg><span id="evo-widget-bubble-label">Chat our team</span>';
        var loading = false;
        bubble.addEventListener('click', function(){
          if (loading) return;
          loading = true;
          bubble.style.opacity = '0.7';
          var s = d.createElement('script');
          s.src = SDK_BASE + '/widget-sdk/sdk.min.js';
          s.async = true;
          s.onload = function(){
            if (window.evoChatSDK && window.evoChatSDK.run) {
              window.evoChatSDK.run({ baseUrl: WIDGET_BASE, websiteToken: 'Hfruti68QWiskKuDm8RrvC5N' });
              bubble.style.opacity = '';
              if (window.evoChatSDK.toggle) window.evoChatSDK.toggle('open');
            }
          };
          s.onerror = function(){ loading = false; bubble.style.opacity = ''; };
          d.head.appendChild(s);
        });
        d.body.appendChild(bubble);
      })(document);
    </script>
