services:
  db:
    image: 'getlago/postgres-partman:15.0-alpine'
    environment:
      - POSTGRES_DB=lago
      - POSTGRES_USER=lago
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - PGDATA=/data/postgres
    volumes:
      - 'lago-postgres-data:/data/postgres'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U lago -d lago -h localhost'
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: 'redis:7-alpine'
    volumes:
      - 'lago-redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    image: 'restart/lago-api:v1.53.0-p6'
    pull_policy: build
    build:
      dockerfile_inline: |
        FROM getlago/api:v1.53.0
        RUN f=app/services/payments/manual_create_service.rb && grep -q 'return result.forbidden_failure! if !License.premium?' $$f && sed -i '/return result.forbidden_failure! if !License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/api_keys/create_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/models/organization.rb && grep -q 'License.premium? && premium_integrations.include?(premium_integration)' $$f && sed -i 's/License.premium? && premium_integrations.include?(premium_integration)/premium_integration == "api_permissions" || (License.premium? \&\& premium_integrations.include?(premium_integration))/' $$f && grep -q 'premium_integration == "api_permissions"' $$f
        RUN f=app/services/billing_entities/update_service.rb && grep -q 'return unless License.premium?' $$f && sed -i '/def assign_premium_attributes/,/^    end/ { /return unless License.premium?/d }' $$f && ! grep -A6 'def assign_premium_attributes' $$f | grep -q 'License.premium?'
        RUN files=$$(grep -rl 'email_settings.include?' app/services) && sed -z -i 's/License\.premium? &&\(\s*\)\([a-z_]*\.billing_entity\.email_settings\.include?\)/\1\2/g' $$files && ! grep -rPzq 'License\.premium\? &&\s*[a-z_]*\.billing_entity\.email_settings' app/services
        RUN f=app/services/payment_requests/create_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/credit_notes/create_service.rb && grep -q '^      License.premium?$$' $$f && sed -i '/def should_create_credit_note?/,/^    end/ s/^      License.premium?$$/      true/' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/credit_notes/estimate_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/models/organization.rb && grep -q 'MULTI_ENTITIES_MAX\[:default\] - billing_entities.active.count' $$f && sed -i 's/MULTI_ENTITIES_MAX\[:default\] - billing_entities.active.count/MULTI_ENTITIES_MAX[:enterprise]/' $$f && ! grep -q 'MULTI_ENTITIES_MAX\[:default\] - billing_entities' $$f
        RUN f=app/services/billing_entities/create_service.rb && grep -q '^        if License.premium?$$' $$f && sed -i 's/^        if License.premium?$$/        if true/' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/payment_intents/fetch_service.rb && grep -q 'provider_session_id: payment_url_result.provider_session_id' $$f && sed -i 's/provider_session_id: payment_url_result.provider_session_id/provider_session_id: (payment_url_result.provider_session_id if payment_url_result.respond_to?(:provider_session_id))/' $$f && grep -q 'respond_to?(:provider_session_id)' $$f
        RUN f=app/services/invoices/payments/flutterwave_service.rb && grep -q 'Money.from_cents(invoice.total_amount_cents, invoice.currency).to_f' $$f && grep -q 'tx_ref: invoice.id,' $$f && sed -i 's/Money.from_cents(invoice.total_amount_cents, invoice.currency).to_f/Money.from_cents(invoice.total_due_amount_cents, invoice.currency).to_f/' $$f && sed -i 's/tx_ref: invoice.id,/tx_ref: "#{invoice.id}-#{SecureRandom.hex(4)}",/' $$f && grep -q 'invoice.total_due_amount_cents' $$f && grep -q 'SecureRandom.hex(4)' $$f
    command:
      - sh
      - '-c'
      - './scripts/migrate.sh && ./scripts/start.api.sh'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_API_3000
      - 'DATABASE_URL=postgresql://lago:${SERVICE_PASSWORD_POSTGRES}@db:5432/lago'
      - 'REDIS_URL=redis://redis:6379'
      - 'SECRET_KEY_BASE=${SECRET_KEY_BASE}'
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - 'LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY}'
      - 'LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_ENCRYPTION_PRIMARY_KEY}'
      - 'LAGO_ENCRYPTION_DETERMINISTIC_KEY=${LAGO_ENCRYPTION_DETERMINISTIC_KEY}'
      - 'LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}'
      - 'LAGO_API_URL=${LAGO_API_URL}'
      - 'LAGO_FRONT_URL=${LAGO_FRONT_URL}'
      - 'LAGO_PDF_URL=http://pdf:3000'
      - 'LAGO_REDIS_CACHE_URL=redis://redis:6379'
      - LAGO_SIDEKIQ_WEB=true
      - LAGO_DISABLE_SIGNUP=false
      - LAGO_CREATE_ORG=true
      - 'LAGO_ORG_NAME=${LAGO_ORG_NAME}'
      - 'LAGO_ORG_USER_EMAIL=${LAGO_ORG_USER_EMAIL}'
      - 'LAGO_ORG_USER_PASSWORD=${LAGO_ORG_USER_PASSWORD}'
    volumes:
      - 'lago-storage-data:/app/storage'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -f http://localhost:3000/health || exit 1'
      interval: 10s
      timeout: 60s
      retries: 15
      start_period: 120s
  front:
    image: 'restart/lago-front:v1.53.0-p6'
    pull_policy: build
    build:
      context: 'https://github.com/getlago/lago-front.git#v1.53.0'
      dockerfile_inline: |
        FROM node:24.20.0-alpine AS deps
        WORKDIR /app
        RUN apk add --no-cache python3 build-base && corepack enable
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        COPY packages/configs/package.json ./packages/configs/
        COPY packages/design-system/package.json ./packages/design-system/
        RUN pnpm install --frozen-lockfile --ignore-scripts

        FROM node:24.20.0-alpine AS build
        WORKDIR /app
        ENV NODE_OPTIONS="--max-old-space-size=4096"
        RUN apk add --no-cache python3 build-base && corepack enable
        COPY --from=deps /app /app
        COPY . .
        COPY <<'PATCH_EOF' /tmp/patch-front.mjs
        // Unlocks "Record a payment" (manual payments) in the self-hosted Lago front end.
        // Upstream gates it behind the premium licence flag in several places; only the
        // record-payment code paths are touched -- credit notes, audit logs and the rest
        // of the premium-gated UI keep their upstream behaviour.
        // Run from the root of getlago/lago-front at tag v1.53.0. Fails loudly if upstream
        // changed, so a version bump can't silently ship an unpatched or half-patched build.
        import { readFileSync, writeFileSync } from 'node:fs'

        const KEY = 'text_1737471851634wpeojigr27w' // "Record a payment"

        const edit = (file, fn) => {
          const before = readFileSync(file, 'utf8')
          const after = fn(before)
          if (after === before) throw new Error(`patch-front: nothing changed in $${file}`)
          writeFileSync(file, after)
          console.log(`patched $${file}`)
        }

        // From the record-payment entry up to the premium dialog fallback, treat the licence as present.
        const unlockBlock = (src) => {
          const start = src.indexOf(KEY)
          if (start === -1) throw new Error('record-payment key not found')
          const m = /(openPremiumWarningDialog\(\)|premiumWarningDialog\.open\(\))/.exec(src.slice(start))
          if (!m) throw new Error('premium dialog fallback not found')
          const end = start + m.index + m[0].length
          return (
            src.slice(0, start) +
            src.slice(start, end).replaceAll('isPremium', '(isPremium || true)') +
            src.slice(end)
          )
        }

        edit('src/components/invoices/InvoicePaymentList.tsx', (s) =>
          s.replace('const { isPremium } = useCurrentUser()', 'useCurrentUser()\n  const isPremium = true'),
        )
        edit('src/components/customers/CustomerPaymentsTab.tsx', (s) =>
          s.replace(
            "hasPermissions(['paymentsCreate']) && isPremium",
            "hasPermissions(['paymentsCreate']) && (isPremium || true)",
          ),
        )
        for (const f of [
          'src/components/customers/CustomerInvoicesList.tsx',
          'src/components/invoices/InvoicesList.tsx',
          'src/pages/CustomerInvoiceDetails.tsx',
          'src/pages/PaymentsPage.tsx',
        ]) {
          edit(f, unlockBlock)
        }

        // API keys: creating more than the first key, and scoping a key's permissions,
        // are licence-gated upstream. The API side is patched in api.Dockerfile.
        edit('src/components/developers/apiKeys/ApiKeys.tsx', (s) =>
          s.replace(
            'const showPremiumAddApiKeyState = !isPremium &&',
            'const showPremiumAddApiKeyState = !(isPremium || true) &&',
          ),
        )
        edit('src/pages/developers/ApiKeysForm.tsx', (s) =>
          s.replace(
            /const hasAccessToApiPermissionsPremiumAddOn = !!premiumIntegrations\?\.includes\(\s*PremiumIntegrationTypeEnum\.ApiPermissions,?\s*\)/,
            'const hasAccessToApiPermissionsPremiumAddOn = !!premiumIntegrations?.includes(PremiumIntegrationTypeEnum.ApiPermissions) || true',
          ),
        )

        // Billing entity timezone (the Edit button on Settings > General) and the manual
        // "Request overdue payment" page: both flags are licence-gated upstream. The API
        // side is patched in api.Dockerfile.
        edit('src/pages/settings/BillingEntity/sections/general/TimezoneBlock.tsx', (s) =>
          s.replace('const { isPremium } = useCurrentUser()', 'useCurrentUser()\n  const isPremium = true'),
        )
        edit('src/pages/CustomerRequestOverduePayment/index.tsx', (s) =>
          s.replace('const hasDunningIntegration = !!isPremium', 'const hasDunningIntegration = !!(isPremium || true)'),
        )

        // Email scenarios (Settings > Email scenarios): the switches check the licence flag.
        for (const f of [
          'src/pages/settings/BillingEntity/sections/BillingEntityEmailScenarios.tsx',
          'src/pages/settings/BillingEntity/sections/BillingEntityEmailScenariosConfig.tsx',
        ]) {
          edit(f, (s) => s.replace(/: isPremium(\s*\n)/, ': (isPremium || true)$$1'))
        }

        // Credit notes: "Issue a credit note" in the invoice list, the invoice page and the
        // invoice's credit-note tab. The API side is patched in api.Dockerfile. (The "Add an
        // entity" button needs no front-end patch: it follows the API's canCreateBillingEntity.)
        const unlockBlockAt = (key) => (src) => {
          const start = src.indexOf(key)
          if (start === -1) throw new Error(`key $${key} not found`)
          const m = /(openPremiumWarningDialog\(\)|premiumWarningDialog\.open\(\))/.exec(src.slice(start))
          if (!m) throw new Error('premium dialog fallback not found')
          const end = start + m.index + m[0].length
          return src.slice(0, start) + src.slice(start, end).replaceAll('isPremium', '(isPremium || true)') + src.slice(end)
        }
        const CREDIT_NOTE_KEY = 'text_636bdef6565341dcb9cfb127' // "Issue a credit note"
        edit('src/pages/CustomerInvoiceDetails.tsx', unlockBlockAt(CREDIT_NOTE_KEY))
        edit('src/components/customers/CustomerInvoicesList.tsx', (s) =>
          s
            .replace('canIssueCreditNote(invoice) && !isPremium', 'canIssueCreditNote(invoice) && !(isPremium || true)')
            .replace('canIssueCreditNote(invoice) && isPremium', 'canIssueCreditNote(invoice) && (isPremium || true)'),
        )
        edit('src/components/invoices/InvoicesList.tsx', (s) => s.replace('if (!isPremium) {', 'if (!(isPremium || true)) {'))
        edit('src/components/invoices/InvoiceCreditNoteList.tsx', (s) => s.replace('{isPremium ? (', '{(isPremium || true) ? ('))
        PATCH_EOF
        RUN node /tmp/patch-front.mjs
        RUN pnpm build

        FROM nginx:1.31-alpine AS runtime
        WORKDIR /usr/share/nginx/html
        RUN apk upgrade --no-cache && apk add --no-cache bash
        COPY --from=build /app/dist .
        COPY ./nginx/nginx.conf /etc/nginx/conf.d/default.conf
        COPY ./nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
        COPY ./nginx/csp.conf /etc/nginx/conf.d/csp.conf
        COPY ./.env.sh ./.env.sh
        EXPOSE 80
        ENTRYPOINT ["/bin/bash", "-c", "./.env.sh && exec nginx -g \"daemon off;\""]
    depends_on:
      api:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_FRONT_80
      - 'API_URL=${LAGO_API_URL}'
      - APP_ENV=production
      - 'LAGO_API_URL=${LAGO_API_URL}'
      - 'LAGO_FRONT_URL=${LAGO_FRONT_URL}'
      - LAGO_DISABLE_PDF_GENERATION=false
  api-worker:
    image: 'restart/lago-api:v1.53.0-p6'
    pull_policy: build
    build:
      dockerfile_inline: |
        FROM getlago/api:v1.53.0
        RUN f=app/services/payments/manual_create_service.rb && grep -q 'return result.forbidden_failure! if !License.premium?' $$f && sed -i '/return result.forbidden_failure! if !License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/api_keys/create_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/models/organization.rb && grep -q 'License.premium? && premium_integrations.include?(premium_integration)' $$f && sed -i 's/License.premium? && premium_integrations.include?(premium_integration)/premium_integration == "api_permissions" || (License.premium? \&\& premium_integrations.include?(premium_integration))/' $$f && grep -q 'premium_integration == "api_permissions"' $$f
        RUN f=app/services/billing_entities/update_service.rb && grep -q 'return unless License.premium?' $$f && sed -i '/def assign_premium_attributes/,/^    end/ { /return unless License.premium?/d }' $$f && ! grep -A6 'def assign_premium_attributes' $$f | grep -q 'License.premium?'
        RUN files=$$(grep -rl 'email_settings.include?' app/services) && sed -z -i 's/License\.premium? &&\(\s*\)\([a-z_]*\.billing_entity\.email_settings\.include?\)/\1\2/g' $$files && ! grep -rPzq 'License\.premium\? &&\s*[a-z_]*\.billing_entity\.email_settings' app/services
        RUN f=app/services/payment_requests/create_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/credit_notes/create_service.rb && grep -q '^      License.premium?$$' $$f && sed -i '/def should_create_credit_note?/,/^    end/ s/^      License.premium?$$/      true/' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/credit_notes/estimate_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/models/organization.rb && grep -q 'MULTI_ENTITIES_MAX\[:default\] - billing_entities.active.count' $$f && sed -i 's/MULTI_ENTITIES_MAX\[:default\] - billing_entities.active.count/MULTI_ENTITIES_MAX[:enterprise]/' $$f && ! grep -q 'MULTI_ENTITIES_MAX\[:default\] - billing_entities' $$f
        RUN f=app/services/billing_entities/create_service.rb && grep -q '^        if License.premium?$$' $$f && sed -i 's/^        if License.premium?$$/        if true/' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/payment_intents/fetch_service.rb && grep -q 'provider_session_id: payment_url_result.provider_session_id' $$f && sed -i 's/provider_session_id: payment_url_result.provider_session_id/provider_session_id: (payment_url_result.provider_session_id if payment_url_result.respond_to?(:provider_session_id))/' $$f && grep -q 'respond_to?(:provider_session_id)' $$f
        RUN f=app/services/invoices/payments/flutterwave_service.rb && grep -q 'Money.from_cents(invoice.total_amount_cents, invoice.currency).to_f' $$f && grep -q 'tx_ref: invoice.id,' $$f && sed -i 's/Money.from_cents(invoice.total_amount_cents, invoice.currency).to_f/Money.from_cents(invoice.total_due_amount_cents, invoice.currency).to_f/' $$f && sed -i 's/tx_ref: invoice.id,/tx_ref: "#{invoice.id}-#{SecureRandom.hex(4)}",/' $$f && grep -q 'invoice.total_due_amount_cents' $$f && grep -q 'SecureRandom.hex(4)' $$f
    command:
      - ./scripts/start.worker.sh
    depends_on:
      api:
        condition: service_healthy
    environment:
      - 'DATABASE_URL=postgresql://lago:${SERVICE_PASSWORD_POSTGRES}@db:5432/lago'
      - 'REDIS_URL=redis://redis:6379'
      - 'SECRET_KEY_BASE=${SECRET_KEY_BASE}'
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - 'LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY}'
      - 'LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_ENCRYPTION_PRIMARY_KEY}'
      - 'LAGO_ENCRYPTION_DETERMINISTIC_KEY=${LAGO_ENCRYPTION_DETERMINISTIC_KEY}'
      - 'LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}'
      - 'LAGO_API_URL=${LAGO_API_URL}'
      - 'LAGO_PDF_URL=http://pdf:3000'
      - 'LAGO_REDIS_CACHE_URL=redis://redis:6379'
    volumes:
      - 'lago-storage-data:/app/storage'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -f http://localhost:8080 || exit 1'
      interval: 10s
      timeout: 60s
      retries: 15
      start_period: 60s
  api-clock:
    image: 'restart/lago-api:v1.53.0-p6'
    pull_policy: build
    build:
      dockerfile_inline: |
        FROM getlago/api:v1.53.0
        RUN f=app/services/payments/manual_create_service.rb && grep -q 'return result.forbidden_failure! if !License.premium?' $$f && sed -i '/return result.forbidden_failure! if !License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/api_keys/create_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/models/organization.rb && grep -q 'License.premium? && premium_integrations.include?(premium_integration)' $$f && sed -i 's/License.premium? && premium_integrations.include?(premium_integration)/premium_integration == "api_permissions" || (License.premium? \&\& premium_integrations.include?(premium_integration))/' $$f && grep -q 'premium_integration == "api_permissions"' $$f
        RUN f=app/services/billing_entities/update_service.rb && grep -q 'return unless License.premium?' $$f && sed -i '/def assign_premium_attributes/,/^    end/ { /return unless License.premium?/d }' $$f && ! grep -A6 'def assign_premium_attributes' $$f | grep -q 'License.premium?'
        RUN files=$$(grep -rl 'email_settings.include?' app/services) && sed -z -i 's/License\.premium? &&\(\s*\)\([a-z_]*\.billing_entity\.email_settings\.include?\)/\1\2/g' $$files && ! grep -rPzq 'License\.premium\? &&\s*[a-z_]*\.billing_entity\.email_settings' app/services
        RUN f=app/services/payment_requests/create_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/credit_notes/create_service.rb && grep -q '^      License.premium?$$' $$f && sed -i '/def should_create_credit_note?/,/^    end/ s/^      License.premium?$$/      true/' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/credit_notes/estimate_service.rb && grep -q 'return result.forbidden_failure! unless License.premium?' $$f && sed -i '/return result.forbidden_failure! unless License.premium?/d' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/models/organization.rb && grep -q 'MULTI_ENTITIES_MAX\[:default\] - billing_entities.active.count' $$f && sed -i 's/MULTI_ENTITIES_MAX\[:default\] - billing_entities.active.count/MULTI_ENTITIES_MAX[:enterprise]/' $$f && ! grep -q 'MULTI_ENTITIES_MAX\[:default\] - billing_entities' $$f
        RUN f=app/services/billing_entities/create_service.rb && grep -q '^        if License.premium?$$' $$f && sed -i 's/^        if License.premium?$$/        if true/' $$f && ! grep -q 'License.premium?' $$f
        RUN f=app/services/payment_intents/fetch_service.rb && grep -q 'provider_session_id: payment_url_result.provider_session_id' $$f && sed -i 's/provider_session_id: payment_url_result.provider_session_id/provider_session_id: (payment_url_result.provider_session_id if payment_url_result.respond_to?(:provider_session_id))/' $$f && grep -q 'respond_to?(:provider_session_id)' $$f
        RUN f=app/services/invoices/payments/flutterwave_service.rb && grep -q 'Money.from_cents(invoice.total_amount_cents, invoice.currency).to_f' $$f && grep -q 'tx_ref: invoice.id,' $$f && sed -i 's/Money.from_cents(invoice.total_amount_cents, invoice.currency).to_f/Money.from_cents(invoice.total_due_amount_cents, invoice.currency).to_f/' $$f && sed -i 's/tx_ref: invoice.id,/tx_ref: "#{invoice.id}-#{SecureRandom.hex(4)}",/' $$f && grep -q 'invoice.total_due_amount_cents' $$f && grep -q 'SecureRandom.hex(4)' $$f
    command:
      - ./scripts/start.clock.sh
    exclude_from_hc: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      - 'DATABASE_URL=postgresql://lago:${SERVICE_PASSWORD_POSTGRES}@db:5432/lago'
      - 'REDIS_URL=redis://redis:6379'
      - 'SECRET_KEY_BASE=${SECRET_KEY_BASE}'
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - 'LAGO_RSA_PRIVATE_KEY=${LAGO_RSA_PRIVATE_KEY}'
      - 'LAGO_ENCRYPTION_PRIMARY_KEY=${LAGO_ENCRYPTION_PRIMARY_KEY}'
      - 'LAGO_ENCRYPTION_DETERMINISTIC_KEY=${LAGO_ENCRYPTION_DETERMINISTIC_KEY}'
      - 'LAGO_ENCRYPTION_KEY_DERIVATION_SALT=${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}'
      - 'LAGO_API_URL=${LAGO_API_URL}'
      - 'LAGO_REDIS_CACHE_URL=redis://redis:6379'
  pdf:
    image: 'getlago/lago-gotenberg:7.8.2'
    exclude_from_hc: true
volumes:
  lago-postgres-data: null
  lago-redis-data: null
  lago-storage-data: null
